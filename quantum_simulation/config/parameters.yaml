# ============================================================
# CONSTANTES PHYSIQUES FONDAMENTALES
# Sources : [file:1, Chapitre I, § A-1]
# ============================================================
physical_constants:
  h: 6.62607015e-34              # Constante de Planck (J·s)
  hbar: 1.054571817e-34          # ℏ = h/(2π) (J·s)
  c: 299792458.0                 # Vitesse de la lumière (m/s)
  m_electron: 9.1093837015e-31   # Masse électron (kg)
  m_proton: 1.67262192369e-27    # Masse proton (kg)
  e_charge: 1.602176634e-19      # Charge élémentaire (C)
  epsilon_0: 8.8541878128e-12    # Permittivité du vide (F/m)

# ============================================================
# PARAMÈTRES NUMÉRIQUES GÉNÉRAUX
# ============================================================
numerical_parameters:
  spatial_discretization:
    dimension: 1                    # 1D, 2D ou 3D
    grid_type: "uniform"            # Type de grille
    nx: 2048                        # Nombre de points (direction x)
    ny: null                        # Nombre de points (direction y)
    nz: null                        # Nombre de points (direction z)
    x_min: -5.0e-9                  # ✅ Grille centrée pour gaussienne
    x_max: 5.0e-9                   # ✅ Couvre ±5σ avec σ=2e-9
    # Idem pour y, z si dimension > 1
    
  temporal_discretization:
    dt: 1.0e-17                     # Pas de temps (s)
    t_initial: 0.0
    t_final: 5.0e-15
    
  tolerances:
    normalization_check: 1.0e-10    # Pour vérifier ⟨ψ|ψ⟩ ≈ 1
    hermiticity_check: 1.0e-10      # Pour vérifier A† = A
    orthonormality_check: 1.0e-8    # Pour bases
    conservation_probability: 1.0e-8 # Conservation norme
    heisenberg_inequality: 1.0e-10  # Tolérance validation ΔX·ΔP ≥ ℏ/2

  derivative_methods:
    finite_difference_order: 2  # 2 ou 4 (décision D2)
    boundary_conditions: "dirichlet"  # Décision D3


# ============================================================
# ACCÉLÉRATION GPU (OPTIONNEL)
# ============================================================
gpu_settings:
  enabled: true                     # Détection automatique GPU
  force_gpu: false                  # Si true, erreur si GPU absent
  device_id: 0                      # ID GPU (multi-GPU)
  memory_fraction: 0.8              # Limite 80% VRAM
  
  # Seuils activation (éviter overhead CPU→GPU)
  min_grid_size_1d: 1024            # GPU si nx > 1024
  min_grid_size_2d: 256             # GPU si nx*ny > 256²
  
  # Méthodes préférées GPU
  prefer_fft: true                  # FFT au lieu différences finies si possible
  prefer_sparse_gpu: true           # CuPy sparse pour Crank-Nicolson
  
  # Debug
  profile_transfers: false          # Mesurer temps CPU↔GPU
  verbose: true                     # Logs activation GPU


# ============================================================
# PARAMÈTRES SPÉCIFIQUES AUX SYSTÈMES
# ============================================================
systems:
  free_particle:
    mass: 9.1093837015e-31      # Masse électron (kg)
    
  harmonic_oscillator:
    mass: 9.1093837015e-31
    omega: 1.0e+15               # Pulsation ω (rad/s)
    n_max_fock: 50               # Troncature base de Fock {|n⟩}
    
  potential_systems:
    infinite_well:
      width: 1.0e-9              # Largeur puits (m)
      mass: 9.1093837015e-31     # Masse particule (kg)
    
    finite_well:
      width: 2.0e-9              # Largeur puits (m)
      depth: 1.0e-18             # Profondeur V₀ (J) ~6 eV
      mass: 9.1093837015e-31
    
    barrier:
      width: 1.0e-9              # Largeur barrière (m)
      height: 5.0e-19            # Hauteur V₀ (J) ~3 eV
      mass: 9.1093837015e-31

# ============================================================
# CONFIGURATION DES EXPÉRIENCES
# ============================================================
experiments:
  wavepacket_evolution:
    initial_state:
      type: "gaussian"
      x0: 0.0                    # Position initiale (m)
      sigma_x: 2.0e-9           # Largeur gaussienne (m)
      k0: 5.0e+9                # Nombre d'onde central (m^-1)
    system:
      mass: 9.1093837015e-31    # Masse électron (kg)
    evolution:
      t_initial: 0.0            # Temps initial (s)
      t_final: 5.0e-15         # Temps final (s)
      dt: 1.0e-17               # Pas temporel (s)
      times_sample: [0.0, 1.0e-15, 2.0e-15, 3.0e-15, 4.0e-15, 5.0e-15]  # Temps échantillonnage
    
  measurement_statistics:
    observable_to_measure: "position"  # "position", "momentum", "energy"
    system_type: "free_particle"       # "free_particle" ou "infinite_well"

    n_measurements: 1000               # Nombre de mesures pour statistiques

    # observable_to_measure: "energy"      # Au lieu de "position"
    # system_type: "infinite_well"         # Au lieu de "free_particle"
    
    # Configuration spatiale locale (surcharge config globale)
    spatial_grid:
      nx: 2048                         # Plus dense pour précision
      x_min: -5.0e-9                   # ✅ Grille centrée
      x_max: 5.0e-9                    # ✅ Couvre ±5σ

      nx: 512
      x_min: 0.0
      x_max: 1.0e-9

    initial_state:

      type: "gaussian"
      x0: 0.0                          # Centré sur grille
      sigma_x: 1.0e-9                  # Largeur réduite pour tenir dans grille
      k0: 5.0e+9                       # Impulsion moyenne
      
      # type: "superposition"
      # n_levels: 3
      # coefficients: [0.6, 0.8j, 0.0]  # |c₁|² + |c₂|² = 1
    
    successive_measurements:
      enabled: true                    # Tester réduction paquet
      n_repetitions: 5                 # Nombre séquences test
      
  heisenberg_validation:
    observables: ["position", "momentum"]
    test_states: []                    # Liste d'états à tester

  # --- Expériences Tome 2 ---
  scattering_yukawa:
    V0: 1.6e-28                   # Couplage Yukawa (J·m) : V₀=1 eV·Å → V(a)≈3.7 eV
    range_a: 1.0e-10              # Portée (m) ~ a₀
    energy: 1.6e-19               # Énergie incidente (~1 eV en J)
    l_max: 5                      # Ordre max ondes partielles
    n_theta: 300                  # Points grille angulaire

  rabi_oscillations:
    transition_frequency: 1.0e+10  # ω₀ (rad/s)
    rabi_frequency: 1.0e+9         # Ω_R (rad/s)
    detunings: [0.0, 5.0e+8, 1.0e+9]  # Désaccords δ (rad/s)
    t_final_factor: 10             # t_final = factor × T_π
    n_points: 500

  hydrogen_fine_structure:
    n: 2                          # Nombre quantique principal
    B_max: 1.0                    # Champ Zeeman max (T)
    n_B_points: 200               # Points balayage en B

  double_slit_2d:
    # CORRECTION ÉCHELLES PHYSIQUES
    slit_separation: 1.0e-8      # d = 10 nm
    slit_width: 2.0e-9           # w = 2 nm
    barrier_position: 0.0
    barrier_thickness: 2.0e-10
    barrier_height: 1.0e-17
    screen_distance: 1.0e-7      # D = 100 nm (×2)
    
    initial_state:
      x0: -5.0e-8                # -50 nm
      y0: 0.0
      sigma_x: 3.0e-9            # 3 nm
      sigma_y: 1.5e-9            # 1.5 nm (cohérence OK)
      momentum_x: 5.0e-23        # 5e-24 kg·m/s (÷4)



# ============================================================
# SPIN (Chapitre IX — Tome 2)
# ============================================================
spin:
  g_electron: 2.0023193043        # Facteur g anomal de l'électron
  mu_B: 9.2740100783e-24          # Magnéton de Bohr (J/T)
  tolerance_pauli: 1.0e-12        # Tolérance {σi,σj} = 2δI

# ============================================================
# COUPLAGE DE MOMENTS ANGULAIRES (Chapitre X — Tome 2)
# ============================================================
angular_momentum:
  j_max: 5.0                      # j max pour précalcul tables CG
  cg_tolerance: 1.0e-10           # Tolérance vérification unitarité CG
  use_sympy_cg: true              # Utiliser sympy si disponible (fallback récursif)

# ============================================================
# DIFFUSION ÉLASTIQUE (Chapitre VIII — Tome 2)
# ============================================================
scattering:
  r_min: 1.0e-15                  # Borne inférieure intégration radiale (m)
  r_max_factor: 30.0              # r_max = r_max_factor × portée potentiel
  n_radial: 2000                  # Points grille radiale
  l_max: 8                        # Ordre maximal ondes partielles
  n_theta: 500                    # Points grille angulaire pour σ(θ)
  convergence_threshold: 1.0e-6   # Seuil convergence |δl|
  optical_theorem_tolerance: 1.0e-4  # Tolérance relative théorème optique

# ============================================================
# THÉORIE DES PERTURBATIONS STATIONNAIRES (Chapitre XI — Tome 2)
# ============================================================
perturbation:
  n_states: 50                    # États dans la somme au 2ème ordre
  degeneracy_threshold: 1.0e-10   # Seuil dégénérescence |En - Ep|
  perturbative_ratio_max: 0.1     # Max |Wnp|/|En-Ep| pour validité
  variational_method: "Nelder-Mead"
  variational_max_iter: 1000

# ============================================================
# PERTURBATIONS DÉPENDANTES DU TEMPS (Chapitre XIII — Tome 2)
# ============================================================
time_dependent:
  n_integration_points: 1000      # Points intégration numérique c_f(t)
  rk45_rtol: 1.0e-8               # Tolérance relative scipy solve_ivp
  rk45_atol: 1.0e-10              # Tolérance absolue scipy solve_ivp
  linear_regime_threshold: 0.1   # Seuil Γ·t ≪ 1

# ============================================================
# PARTICULES IDENTIQUES (Chapitre XIV — Tome 2)
# ============================================================
identical_particles:
  orthonormality_tolerance: 1.0e-10  # Tolérance ⟨φi|φj⟩ = δij

# ============================================================
# VISUALISATION
# ============================================================
visualization:
  plot_wavefunction: true
  plot_probability_density: true
  plot_current_density: false
  create_animation: false        # true pour créer GIF (plus lent)
  save_figures: true
  output_directory: "./quantum_simulation/results/"
  dpi: 150